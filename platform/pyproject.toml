
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graf-lab-core"
version = "0.1.0"
description = "Core platform for Graf Lab"
requires-python = ">=3.12"
dependencies = [
    "graf-lab-api>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
